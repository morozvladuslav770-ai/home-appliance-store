    Встановлення й догляд: залиште вільний простір ззаду та з боків для вентиляції, не ставте холодильник поряд з плитою чи батареєю. Після транспортування витримайте його у вертикальному положенні кілька годин перед першим вмиканням. Точні габарити, комплектацію й гарантійні умови дивіться в документації виробника та гарантійному талоні.

