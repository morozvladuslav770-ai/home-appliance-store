    Система No Frost розподіляє холодне повітря камерами за допомогою вентилятора, тож на стінках не утворюється паморозь, а морозильну камеру не потрібно розморожувати вручну. Інверторний компресор плавно змінює потужність залежно від навантаження: він працює рівномірніше за звичайний, а це зазвичай означає тихіший хід і стабільнішу температуру всередині.

